<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Berichtsheft KI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            padding: 25px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 27px;
        }

        header p {
            margin: 7px 0 0;
            opacity: .85;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .top-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .top-card h2 {
            margin-top: 0;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 13px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .field {
            margin-bottom: 16px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-button {
            border: none;
            padding: 14px 8px;
            border-radius: 12px;
            background: #e5e7eb;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .day-button.active {
            background: #2563eb;
            color: white;
        }

        .editor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #172033;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        button:hover {
            opacity: .9;
        }

        .status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .status.show {
            display: block;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .report {
            white-space: pre-wrap;
            min-height: 200px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            line-height: 1.6;
        }

        .saved-list {
            margin-top: 20px;
        }

        .saved-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .small {
            font-size: 13px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #64748b;
        }

        @media (max-width: 800px) {
            .editor {
                grid-template-columns: 1fr;
            }

            .days {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 23px;
            }

            .container {
                padding: 12px;
            }

            .card,
            .top-card {
                padding: 15px;
            }

            .day-button {
                padding: 12px 3px;
                font-size: 12px;
            }
        }

        @media print {
            header,
            .days,
            .button-row,
            footer,
            .top-card {
                display: none !important;
            }

            body {
                background: white;
            }

            .container {
                max-width: 100%;
            }

            .editor {
                display: block;
            }

            .card {
                box-shadow: none;
                border: none;
            }

            #notizenCard {
                display: none;
            }

            .report {
                border: none;
                background: white;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🤖 Berichtsheft KI</h1>
    <p>Deine Notizen → dein fertiger Berichtsheft-Text</p>
</header>

<div class="container">

    <div class="top-card">

        <h2>📘 Mein Berichtsheft</h2>

        <div class="field">
            <label>Beruf / Ausbildung</label>
            <input
                id="beruf"
                type="text"
                placeholder="z. B. Kfz-Mechatroniker"
            >
        </div>

        <div class="field">
            <label>Woche</label>
            <input
                id="woche"
                type="text"
                placeholder="z. B. 15.09.2026 – 19.09.2026"
            >
        </div>

        <div class="field">
            <label>Schreibstil</label>

            <select id="stil">
                <option value="normal">Normal</option>
                <option value="einfach">Einfach und verständlich</option>
                <option value="professionell">Professionell</option>
                <option value="kurz">Kurz</option>
                <option value="ausführlich">Ausführlich</option>
            </select>
        </div>

    </div>

    <div class="days">

        <button class="day-button active" onclick="selectDay('Montag', this)">
            Montag
        </button>

        <button class="day-button" onclick="selectDay('Dienstag', this)">
            Dienstag
        </button>

        <button class="day-button" onclick="selectDay('Mittwoch', this)">
            Mittwoch
        </button>

        <button class="day-button" onclick="selectDay('Donnerstag', this)">
            Donnerstag
        </button>

        <button class="day-button" onclick="selectDay('Freitag', this)">
            Freitag
        </button>

    </div>

    <div class="editor">

        <div class="card" id="notizenCard">

            <h2>📝 <span id="dayTitle">Montag</span></h2>

            <div class="field">

                <label>Arbeitszeit</label>

                <input
                    id="arbeitszeit"
                    type="text"
                    placeholder="z. B. 08:00 – 16:30 Uhr"
                >

            </div>

            <div class="field">

                <label>🔑 Stichwörter</label>

                <input
                    id="stichwoerter"
                    type="text"
                    placeholder="z. B. Ölwechsel, Bremsen, Kunde"
                >

            </div>

            <div class="field">

                <label>📝 Meine Notizen</label>

                <textarea
                    id="notizen"
                    placeholder="Schreibe hier einfach deine Notizen hinein. Du musst keine ganzen Sätze schreiben.

Beispiel:
Golf in Werkstatt
Öl gewechselt
Bremsen kontrolliert
Kunde erklärt was gemacht wurde"
                ></textarea>

            </div>

            <button class="primary" onclick="erstelleBericht()">
                ✨ KI-TEXT ERSTELLEN
            </button>

            <div id="status" class="status"></div>

        </div>

        <div class="card">

            <h2>📄 Fertiger Bericht</h2>

            <div
                id="bericht"
                class="report"
            >
                Noch kein Bericht erstellt.
            </div>

            <div class="button-row">

                <button
                    class="success"
                    onclick="speichern()"
                >
                    💾 Speichern
                </button>

                <button
                    class="secondary"
                    onclick="window.print()"
                >
                    📄 PDF / Drucken
                </button>

                <button
                    class="secondary"
                    onclick="berichtBearbeiten()"
                >
                    ✏️ Bearbeiten
                </button>

            </div>

        </div>

    </div>

    <div class="card saved-list">

        <h2>💾 Gespeicherte Berichte</h2>

        <div id="gespeicherteBerichte">
            Noch keine Berichte gespeichert.
        </div>

    </div>

</div>

<footer>
    Berichtsheft KI – Version 1
</footer>


<script>

const tage = {
    Montag: {
        arbeitszeit: "",
        stichwoerter: "",
        notizen: "",
        bericht: ""
    },

    Dienstag: {
        arbeitszeit: "",
        stichwoerter: "",
        notizen: "",
        bericht: ""
    },

    Mittwoch: {
        arbeitszeit: "",
        stichwoerter: "",
        notizen: "",
        bericht: ""
    },

    Donnerstag: {
        arbeitszeit: "",
        stichwoerter: "",
        notizen: "",
        bericht: ""
    },

    Freitag: {
        arbeitszeit: "",
        stichwoerter: "",
        notizen: "",
        bericht: ""
    }
};

let aktuellerTag = "Montag";


function selectDay(tag, button) {

    speichereAktuelleEingabe();

    aktuellerTag = tag;

    document
        .querySelectorAll(".day-button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("dayTitle").textContent = tag;

    ladeTag();

}


function speichereAktuelleEingabe() {

    tage[aktuellerTag].arbeitszeit =
        document.getElementById("arbeitszeit").value;

    tage[aktuellerTag].stichwoerter =
        document.getElementById("stichwoerter").value;

    tage[aktuellerTag].notizen =
        document.getElementById("notizen").value;

    tage[aktuellerTag].bericht =
        document.getElementById("bericht").textContent;

}


function ladeTag() {

    const daten = tage[aktuellerTag];

    document.getElementById("arbeitszeit").value =
        daten.arbeitszeit;

    document.getElementById("stichwoerter").value =
        daten.stichwoerter;

    document.getElementById("notizen").value =
        daten.notizen;

    document.getElementById("bericht").textContent =
        daten.bericht || "Noch kein Bericht erstellt.";

}


async function erstelleBericht() {

    speichereAktuelleEingabe();

    const notizen =
        tage[aktuellerTag].notizen.trim();

    const stichwoerter =
        tage[aktuellerTag].stichwoerter.trim();

    const arbeitszeit =
        tage[aktuellerTag].arbeitszeit.trim();

    const beruf =
        document.getElementById("beruf").value.trim();

    const stil =
        document.getElementById("stil").value;

    if (!notizen && !stichwoerter) {

        alert(
            "Bitte gib zuerst deine Notizen oder Stichwörter ein."
        );

        return;
    }

    const status =
        document.getElementById("status");

    status.classList.add("show");

    status.textContent =
        "🤖 KI erstellt deinen Bericht...";

    try {

        const antwort = await fetch(
            "DEINE_BACKEND_URL/bericht",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    tag: aktuellerTag,

                    beruf: beruf,

                    arbeitszeit: arbeitszeit,

                    stichwoerter: stichwoerter,

                    notizen: notizen,

                    stil: stil

                })

            }
        );

        if (!antwort.ok) {

            throw new Error(
                "Serverfehler: " + antwort.status
            );

        }

        const daten =
            await antwort.json();

        tage[aktuellerTag].bericht =
            daten.bericht;

        document.getElementById("bericht").textContent =
            daten.bericht;

        status.textContent =
            "✅ Bericht wurde erstellt.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Die KI konnte nicht erreicht werden.";

        alert(
            "Die KI-Verbindung funktioniert noch nicht. Das richten wir in den nächsten Schritten ein."
        );

    }

}


function speichern() {

    speichereAktuelleEingabe();

    const daten = {

        beruf:
            document.getElementById("beruf").value,

        woche:
            document.getElementById("woche").value,

        stil:
            document.getElementById("stil").value,

        tage:
            tage,

        gespeichertAm:
            new Date().toLocaleString("de-DE")

    };

    const alteBerichte =
        JSON.parse(
            localStorage.getItem("berichtshefte") || "[]"
        );

    alteBerichte.push(daten);

    localStorage.setItem(
        "berichtshefte",
        JSON.stringify(alteBerichte)
    );

    zeigeGespeicherteBerichte();

    alert("Berichtsheft wurde gespeichert.");

}


function zeigeGespeicherteBerichte() {

    const element =
        document.getElementById(
            "gespeicherteBerichte"
        );

    const daten =
        JSON.parse(
            localStorage.getItem("berichtshefte") || "[]"
        );

    if (daten.length === 0) {

        element.textContent =
            "Noch keine Berichte gespeichert.";

        return;
    }

    element.innerHTML = "";

    daten
        .slice()
        .reverse()
        .forEach((bericht, index) => {

            const div =
                document.createElement("div");

            div.className =
                "saved-item";

            const info =
                document.createElement("div");

            info.innerHTML = `
                <strong>
                    ${bericht.woche || "Ohne Woche"}
                </strong>
                <div class="small">
                    ${bericht.beruf || "Beruf nicht angegeben"}
                    · ${bericht.gespeichertAm}
                </div>
            `;

            const button =
                document.createElement("button");

            button.className =
                "secondary";

            button.textContent =
                "Ansehen";

            button.onclick = () => {

                const originalIndex =
                    daten.length - 1 - index;

                ladeGespeichertenBericht(
                    daten[originalIndex]
                );

            };

            div.appendChild(info);
            div.appendChild(button);

            element.appendChild(div);

        });

}


function ladeGespeichertenBericht(daten) {

    document.getElementById("beruf").value =
        daten.beruf || "";

    document.getElementById("woche").value =
        daten.woche || "";

    document.getElementById("stil").value =
        daten.stil || "normal";

    Object.keys(tage).forEach(tag => {

        if (daten.tage[tag]) {

            tage[tag] =
                daten.tage[tag];

        }

    });

    ladeTag();

    alert(
        "Gespeichertes Berichtsheft geladen."
    );

}


function berichtBearbeiten() {

    const bericht =
        document.getElementById("bericht");

    const neuerText =
        prompt(
            "Bearbeite deinen Bericht:",
            bericht.textContent
        );

    if (
        neuerText !== null &&
        neuerText.trim() !== ""
    ) {

        bericht.textContent =
            neuerText;

        tage[aktuellerTag].bericht =
            neuerText;

    }

}


zeigeGespeicherteBerichte();

</script>

</body>
</html>
